<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PAS 十资产 EDA</title>
<style>body{font:15px system-ui;margin:24px;background:#f4f6fa;color:#182334}section{background:white;padding:18px;margin:18px 0;border-radius:10px}canvas{display:block;width:100%;height:230px;border:1px solid #ddd;touch-action:none}label{margin-right:14px}input,select,button{margin:5px;padding:5px}button{cursor:pointer}img{max-width:100%}.controls{position:sticky;top:0;background:#eef2f8;padding:8px;z-index:5}#tip{position:fixed;pointer-events:none;background:#152234;color:white;padding:10px;display:none;white-space:pre;z-index:10;font:12px monospace}small{color:#536174}#meta{line-height:1.7}h2{font-size:20px}</style>
<h1>PAS — 十资产历史行情观察台</h1>
<p id="meta"></p><p>UTC as-of：available=max(requested,received,stored)≤决策时点；book event/receipt TTL 90秒。异步REST报价，不是同步成交。A保留新有效事件零收益；B额外要求顶层价变化且事件间隔30–90秒。缺失不补零、不插值；RV完整窗、不年化。</p>
<div class="controls"><label>观察资产 <select id="asset"></select></label><label><input id="benchmark" type="checkbox" checked>对照 BTC</label><label><input id="strict" type="checkbox" checked>显示 Strict B</label><br>UTC <input id="start" type="datetime-local"> — <input id="end" type="datetime-local"><button id="apply">应用范围</button><button id="reset">完整历史</button><button id="day">末尾24小时</button><small>拖动任一时序图同步缩放；双击恢复。悬停查看UTC与数值。事件分布固定展示全历史，不跟随时序缩放。</small></div>
<div id="plots"></div><div id="tip"></div>
<details><summary>五类独立 PNG</summary><img src="figure-01.png"><img src="figure-02.png"><img src="figure-03.png"><img src="figure-04.png"><img src="figure-05.png"></details>
<script>
const D=__DATA__,times=D.times,$=id=>document.getElementById(id);let left=0,right=times.length-1,panels=[],selected='pas:ETH';
const color=s=>D.colors[D.symbols.indexOf(s)],utc=t=>new Date(t).toISOString();
$('meta').textContent=`真实 hyperliquid-testnet/pas 公共行情 | ${D.summary.start_utc} — ${D.summary.end_utc} | 共同Mid=100基点 ${D.summary.common_start_utc}。十资产快照截至10月30日，短于原BTC/ETH版；全部历史已见，不是干净样本外。仅描述，无预测/盈利结论。`;
D.symbols.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s.slice(4);$('asset').append(o)});$('asset').value=selected;
const tip=(e,text)=>{let el=$('tip');el.textContent=text;el.style.display='block';el.style.left=Math.max(0,Math.min(e.clientX+12,innerWidth-390))+'px';el.style.top=Math.max(0,Math.min(e.clientY+12,innerHeight-250))+'px'};
function range(){ $('start').value=utc(times[left]).slice(0,16);$('end').value=utc(times[right]).slice(0,16)}
function reset(){left=0;right=times.length-1;range();redraw()}
function setRange(a,b){if(!Number.isFinite(a)||!Number.isFinite(b)||a>=b||b<times[0]||a>times.at(-1))return;let l=times.findIndex(t=>t>=a),r=times.findLastIndex(t=>t<=b);if(r<=l)return;left=l;right=r;range();redraw()}
$('apply').onclick=()=>setRange(Date.parse($('start').value+'Z'),Date.parse($('end').value+'Z'));$('reset').onclick=reset;$('day').onclick=()=>setRange(times.at(-1)-86400000,times.at(-1));
function redraw(){panels.forEach(draw)}
function section(title,note){let s=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=note;s.append(h,p);$('plots').append(s);return s}
function line(s,name,y,dash=false){return {name:s+' '+name,y,color:color(s),dash,on:true}}
function chart(sec,unit,lines,flags=false,ref=null){let p={unit,lines,flags,ref},label=document.createElement('p');label.textContent=unit;sec.append(label);for(let l of lines){let lab=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=l.on;cb.onchange=()=>{l.on=cb.checked;draw(p)};lab.style.color=l.color;lab.append(cb,document.createTextNode(l.name));sec.append(lab)}let cv=document.createElement('canvas');sec.append(cv);p.canvas=cv;panels.push(p);let down=null;
 const index=e=>Math.round(left+Math.max(0,Math.min(1,(e.offsetX-72)/(cv.clientWidth-95)))*(right-left));
 cv.onpointerdown=e=>{down=index(e);cv.setPointerCapture(e.pointerId)};cv.onpointerup=e=>{let z=index(e);if(down!==null&&Math.abs(z-down)>2){left=Math.min(z,down);right=Math.max(z,down);range();redraw()}down=null};cv.onpointercancel=()=>down=null;cv.ondblclick=reset;cv.onpointerleave=()=>$('tip').style.display='none';cv.onpointermove=e=>{let i=index(e);tip(e,utc(times[i])+'\n'+lines.filter(l=>l.on).map(l=>l.name+': '+(l.y[i]===null?'MISSING':Number(l.y[i]).toPrecision(7))).join('\n'))};return p}
function draw(p){let cv=p.canvas,w=cv.clientWidth,h=230;cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;let c=cv.getContext('2d');c.scale(devicePixelRatio,devicePixelRatio);let active=p.lines.filter(l=>l.on),min=Infinity,max=-Infinity;active.forEach(l=>{for(let i=left;i<=right;i++){let v=l.y[i];if(v!==null){min=Math.min(min,v);max=Math.max(max,v)}}});c.font='11px monospace';if(!isFinite(min)){c.fillText('No valid observations / all curves hidden',72,100);return}if(p.ref!==null){min=Math.min(min,p.ref);max=Math.max(max,p.ref)}let pad=(max-min)*.08||1;min-=pad;max+=pad;const X=i=>72+(i-left)/(right-left)*(w-95),Y=v=>190-(v-min)/(max-min)*165;
 for(let j=0;j<=4;j++){let v=min+(max-min)*j/4,y=Y(v);c.strokeStyle='#e4e8ed';c.beginPath();c.moveTo(72,y);c.lineTo(w-23,y);c.stroke();c.fillStyle='#456';if(!p.flags)c.fillText(v.toPrecision(4),2,y+3);let i=Math.round(left+(right-left)*j/4);c.fillText(utc(times[i]).slice(5,16).replace('T',' '),Math.min(w-110,Math.max(72,X(i)-35)),218)}
 if(p.ref!==null){c.strokeStyle='#c12c40';c.setLineDash([5,3]);c.beginPath();c.moveTo(72,Y(p.ref));c.lineTo(w-23,Y(p.ref));c.stroke();c.setLineDash([])}
 active.forEach((l,k)=>{c.strokeStyle=l.color;c.fillStyle=l.color;c.setLineDash(l.dash?[3,3]:[]);c.beginPath();let open=false;if(p.flags)c.fillText(l.name,75,25+k*55);for(let i=left;i<=right;i++){let v=l.y[i];if(v===null){open=false;continue}if(p.flags){if(v){c.moveTo(X(i),32+k*55);c.lineTo(X(i),48+k*55)}continue}if(open)c.lineTo(X(i),Y(v));else c.moveTo(X(i),Y(v));open=true}c.stroke();if(!p.flags)for(let i=left;i<=right;i++){let v=l.y[i];if(v!==null&&(right-left<300||((i===left||l.y[i-1]===null)&&(i===right||l.y[i+1]===null)))){c.beginPath();c.arc(X(i),Y(v),1.5,0,7);c.fill()}}});c.setLineDash([])}
function events(sec){if(selected==='pas:BTC'){let p=document.createElement('p');p.textContent='BTC为冲击源。选择其余九资产查看冲击后的描述性结果分布。';sec.append(p);return}for(let dir of ['up','down'])for(let h of ['5','15','30']){let s=D.summary.event_stats[selected][dir][h],q=s.distribution.quantiles,es=D.events.filter(e=>e.direction===dir&&e.outcomes[selected][h].value!==null),p=document.createElement('p');p.textContent=`${dir} +${h}m: n=${s.valid}/${s.events}; missing=${s.missing} (tail ${s.tail_missing}); median=${q?q['0.5'].toFixed(5):'NA'}%; IQR=${q?(q['0.75']-q['0.25']).toFixed(5):'NA'}%; overlapping events=${s.overlap_events}`;sec.append(p);if(!es.length)continue;let cv=document.createElement('canvas');cv.style.height='150px';cv.width=1100;cv.height=150;sec.append(cv);let c=cv.getContext('2d'),vals=es.map(e=>e.outcomes[selected][h].value),lo=Math.min(0,...vals),hi=Math.max(0,...vals),X=v=>60+(v-lo)/(hi-lo||1)*980;c.strokeStyle='#aaa';c.beginPath();c.moveTo(X(0),5);c.lineTo(X(0),125);c.stroke();c.font='12px monospace';c.fillStyle='#456';c.fillText(lo.toFixed(3)+'%',5,145);c.fillText(hi.toFixed(3)+'%',1000,145);let points=es.map(e=>({x:X(e.outcomes[selected][h].value),y:22+(e.i%19)*5,e}));points.forEach(p=>{c.fillStyle=p.e.overlap?'#c12c4055':'#1674b899';c.beginPath();c.arc(p.x,p.y,2,0,7);c.fill()});cv.onmousemove=e=>{let x=e.offsetX/cv.clientWidth*1100,y=e.offsetY/cv.clientHeight*150,p=points.reduce((a,b)=>Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a).e;tip(e,p.utc+'\n'+selected+' +'+h+'m: '+p.outcomes[selected][h].value.toPrecision(7)+'%\ncluster '+p.cluster+'; overlap '+p.overlap)};cv.onmouseleave=()=>$('tip').style.display='none'}}
function build(){panels=[];$('plots').replaceChildren();let focus=[selected];if($('benchmark').checked&&selected!=='pas:BTC')focus.push('pas:BTC');let strict=$('strict').checked;
 let sec=section('1 — 标准化价格 / 全十资产','共同有效起点=100；缺口保留。默认显示所选资产与BTC，可单独开关其余曲线。');chart(sec,'Mid index',D.symbols.map(s=>({...line(s,'',D.assets[s].index),on:focus.includes(s)})),false,100);
 sec=section('2 — 分钟有符号收益与质量标记','单位为对数收益%；同步UTC信息集上的异步报价，不是同步成交。静止顶层价的新事件不自动认定为陈旧。');chart(sec,'signed minute log returns %',focus.map(s=>line(s,'A',D.assets[s].returns.A)),false,0);for(let s of focus)chart(sec,s+' quote flags',D.assets[s].flags.map((v,i)=>({name:['missing/expired','same event reused','unchanged top, new event'][i],y:v,color:['#c12c40','#7948b8','#888'][i],on:true})),true);
 sec=section('3 — 过去5 / 15 / 30 / 60分钟 RV','A实线；B虚线。严格连续墙钟窗口；B空白表示窗口不可用。共同完整窗数值相等，曲线重合不表示B不存在。');for(let w of ['5','15','30','60'])chart(sec,'RV'+w+' % (not annualized)',focus.flatMap(s=>[line(s,'A',D.assets[s].rv[w].A),...(strict?[line(s,'B',D.assets[s].rv[w].B,true)]:[])]));
 sec=section('4 — BTC冲击后目标资产分布 / 全历史',`开发段固定Q05/Q95=${D.summary.threshold_pct.q05.toFixed(6)}% / ${D.summary.threshold_pct.q95.toFixed(6)}%；${D.summary.event_count}事件，${D.summary.overlap_clusters}连通簇。红点为重叠事件，簇也不代表独立样本。事件入选不依赖未来标签，结果要求完整连续收益；无预测或盈利结论。`);events(sec);
 sec=section('5 — 数据质量与执行摩擦','full spread仅作Mid不变时跨价往返成本参考；不含手续费、深度、滑点及延迟。event age包括过期的原始所选报价，红线=90s TTL；有效收益另要求receipt TTL。');chart(sec,'Quoted full spread bps',focus.map(s=>line(s,'',D.assets[s].spread)));chart(sec,'Raw book event age seconds',focus.map(s=>line(s,'',D.assets[s].age)),false,90);chart(sec,'Invalid RV30 (100=true)',focus.flatMap(s=>['A',...(strict?['B']:[])].map(m=>line(s,m,D.assets[s].rv['30'][m].map(v=>v===null?100:0),m==='B'))));chart(sec,'Trailing60 UTC points valid return coverage % (initial partial denominator)',focus.flatMap(s=>['A',...(strict?['B']:[])].map(m=>line(s,m,D.assets[s].coverage[m],m==='B'))));chart(sec,'All TEN assets jointly valid coverage % / trailing60 UTC points',Object.entries(D.joint).map(([m,y],i)=>({name:'joint '+m,y,color:['#1674b8','#e57820','#333'][i],on:true,dash:m==='B'})));range();redraw()}
$('asset').onchange=()=>{selected=$('asset').value;build()};$('benchmark').onchange=build;$('strict').onchange=build;window.onresize=redraw;build();
</script></html>
