<svg xmlns="http://www.w3.org/2000/svg" width="280" height="784" viewBox="0 0 280 784" role="img" aria-labelledby="title desc">
<title id="title">Agent/Core Research and Synthetic Paper</title>
<desc id="desc">Two separate tested entrypoints share job and forecast contracts. Historical Gateway jobs run in Shadow mode; Paper execution uses synthetic fixture context.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;text-anchor:middle}.node{fill:#f1f5f9;stroke:#64748b;stroke-width:1.3}.edge{stroke:#64748b;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
<rect x="0.5" y="0.5" width="279" height="783" rx="8" fill="white" stroke="#cbd5e1"/>
<text x="140" y="28" font-size="16" font-weight="bold">Historical Shadow Demo</text>
<rect class="node" x="20" y="46" width="240" height="48" rx="5"/>
<text x="140" y="76" font-size="17">Historical data</text>
<path class="edge" d="M140 94 V116"/>
<rect class="node" x="20" y="122" width="240" height="48" rx="5"/>
<text x="140" y="152" font-size="17">As-of Data Gateway</text>
<path class="edge" d="M140 170 V192"/>
<rect class="node" x="20" y="198" width="240" height="48" rx="5"/>
<text x="140" y="228" font-size="17">Shadow analysis jobs</text>
<text x="140" y="268" font-size="13">Read-only; no trade execution</text>
<path d="M20 288 H260" stroke="#cbd5e1" stroke-dasharray="4 4"/>
<text x="140" y="318" font-size="16" font-weight="bold">Synthetic Paper Demo</text>
<rect class="node" x="20" y="336" width="240" height="48" rx="5"/>
<text x="140" y="366" font-size="17">Synthetic context</text>
<path class="edge" d="M140 384 V406"/>
<rect class="node" x="20" y="412" width="240" height="48" rx="5"/>
<text x="140" y="442" font-size="17">Forecast jobs</text>
<path class="edge" d="M140 460 V482"/>
<rect class="node" x="20" y="488" width="240" height="48" rx="5"/>
<text x="140" y="518" font-size="17">Portfolio &amp; Risk Gate</text>
<path class="edge" d="M140 536 V558"/>
<rect class="node" x="20" y="564" width="240" height="48" rx="5"/>
<text x="140" y="594" font-size="17">Paper execution</text>
<path class="edge" d="M140 612 V634"/>
<rect class="node" x="20" y="640" width="240" height="48" rx="5"/>
<text x="140" y="670" font-size="17">Reports &amp; feedback</text>
<text x="140" y="714" font-size="13">Fixture inputs; explicit resume</text>
<text x="140" y="750" font-size="13">Shared contracts; separate demos</text>
</svg>
