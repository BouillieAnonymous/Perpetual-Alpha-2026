<text x="265" y="324" font-size="16" text-anchor="middle">Gated Testnet</text>
<text x="265" y="344" font-size="16" text-anchor="middle">order lifecycle</text>
</g>
<g id="FEEDBACK"><rect class="research" x="362" y="280" width="150" height="98" rx="6" stroke-width="1.3"/>
<text x="437" y="314" font-size="16" text-anchor="middle">Journal /</text>
<text x="437" y="334" font-size="16" text-anchor="middle">reconciliation /</text>
<text x="437" y="354" font-size="16" text-anchor="middle">feedback</text>
</g>
<g id="PAPER"><rect class="research" x="534" y="280" width="150" height="98" rx="6" stroke-width="1.3"/>
<text x="609" y="324" font-size="16" text-anchor="middle">Synthetic Paper /</text>
<text x="609" y="344" font-size="16" text-anchor="middle">Mock execution</text>
</g>
<g id="RISK"><rect class="research" x="706" y="280" width="150" height="98" rx="6" stroke-width="1.3"/>
<text x="781" y="314" font-size="16" text-anchor="middle">Independent</text>
<text x="781" y="334" font-size="16" text-anchor="middle">Risk Gate /</text>
<text x="781" y="354" font-size="16" text-anchor="middle">Supervisor</text>
</g>
</svg>
