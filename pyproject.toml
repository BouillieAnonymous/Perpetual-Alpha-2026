[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "perpetual-alpha"
version = "0.1.0"
description = "Single-market, testnet-only Perpetual Alpha competition toolkit"
requires-python = ">=3.11,<3.14"
dependencies = ["hyperliquid-python-sdk==0.24.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
alpha = "perpetual_alpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/perpetual_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
