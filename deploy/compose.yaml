services:
  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: perpetual-alpha-collector:2026-10-08
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 45s
    volumes:
      - /opt/perpetual-alpha/data:/data
      - /opt/perpetual-alpha/config/collector.toml:/app/config/collector.toml:ro
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -m, perpetual_alpha.cli, status]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  connection-check:
    profiles: [diagnostics]
    build:
      context: .
      dockerfile: Dockerfile.check
    image: perpetual-alpha-connection-check:2026-10-08
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - /opt/perpetual-alpha/data:/data
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
