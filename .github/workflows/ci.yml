name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deploy/requirements-check.txt
            config/requirements-ci.txt

      - name: Install project and check tools
        run: python -m pip install -r deploy/requirements-check.txt -r config/requirements-ci.txt -e .

      - name: Check Python code
        run: python -m ruff check . --output-format=github

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate contract schemas and examples
        run: python scripts/validate_schemas.py

      - name: Run offline multi-asset simulation
        run: python -m perpetual_alpha.cli dry-run --journal .cache/ci-dry-run.sqlite3
