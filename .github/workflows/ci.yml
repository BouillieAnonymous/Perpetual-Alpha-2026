name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server container / Python 3.12.15
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the deployed runtime image
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t perpetual-alpha-runtime:ci .

      - name: Build the check layer
        run: docker build --platform linux/amd64 -f deploy/Dockerfile.ci -t perpetual-alpha-checks:ci .

      - name: Verify server Python and pinned dependencies
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_runtime.py
          docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python -m pip check

      - name: Check Python code
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python -m ruff check . --no-cache --output-format=github

      - name: Run offline regression tests
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python -m unittest discover -s tests -v

      - name: Validate contract schemas and examples
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_schemas.py

      - name: Verify offline public history capture and read-only WAL access
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_history.py

      - name: Verify synthetic readonly account evidence and separate schema
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_account.py

      - name: Verify frozen market risk replay and existing risk schema
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_market_risk.py

      - name: Verify frozen traditional research evidence and offline replays
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_quant_research.py

      - name: Verify synthetic Portfolio independent Risk Gate Supervisor and Mock
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_portfolio_risk.py

      - name: Verify recoverable synthetic Paper ledger and atomic feedback
        run: docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python scripts/validate_paper.py

      - name: Run offline multi-asset simulations
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python -m perpetual_alpha.cli dry-run --journal /tmp/ci-dry-run.sqlite3
          docker run --rm --network none --read-only --tmpfs /tmp perpetual-alpha-checks:ci python -m perpetual_alpha.examples.lt_adapter --journal /tmp/lt-ci-dry-run.sqlite3

      - name: Verify fixture-only Core and Dummy in separate containers
        run: |
          docker build --platform linux/amd64 -f deploy/Dockerfile.mock-http -t perpetual-alpha-mock-http:ci .
          python3 scripts/validate_mock_http_containers.py

      - name: Verify shadow historical Gateway in separate containers
        run: python3 scripts/validate_mock_http_containers.py --history

      - name: Verify Paper Core and Dummy containers with explicit resume and paused restart
        run: python3 scripts/validate_paper_http_containers.py

      - name: Verify isolated Paper operations backup restore and faults
        run: |
          docker build --platform linux/amd64 -f deploy/Dockerfile.paper -t perpetual-alpha-paper:ci .
          python3 scripts/validate_paper_ops_containers.py --soak-seconds 60
