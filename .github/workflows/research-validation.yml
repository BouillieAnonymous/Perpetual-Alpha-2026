name: Research preservation

on:
  push:
    branches: ["integration/pa26-final"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Isolated research tests and evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.15'
      - name: Verify original blobs and maintained navigation
        run: |
          python research/tools/verify_integrity.py
          python research/tools/check_links.py
          python -m unittest discover -s research/tools -v
      - name: Install isolated research test dependencies
        run: |
          python -m pip install -r deploy/requirements-check.txt -r config/requirements-ci.txt -r research/legacy/config/requirements-quant-research.txt -r research/legacy/config/requirements-research.txt
          python -m pip check
      - name: Materialize historical layout without credentials
        run: python research/tools/workspace.py "$RUNNER_TEMP/pa26-research" --experimental
      - name: Run offline research and prototype unit tests
        run: |
          cd "$RUNNER_TEMP/pa26-research"
          PYTHONPATH=src:tests:scripts python -m unittest test_basis_research test_basis_direction test_basis_convergence test_multi_asset_basis test_offline_quant test_official_cost_audit test_market_transfer test_asset_coverage test_candidate_validation test_long_history test_regime_study test_stream_collection -v
